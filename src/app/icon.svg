<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="veloraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Badge -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#veloraGrad)" filter="url(#shadow)" />
  
  <!-- Subtle Outer Ring -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#ffffff" stroke-width="6" stroke-opacity="0.25" />

  <!-- Inner Store Front & "V" Monogram -->
  <g transform="translate(256, 256)">
    <!-- Store Roof Accent -->
    <path d="M-130 -60 L0 -140 L130 -60" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Stylized "V" Storefront Base -->
    <path d="M-100 -20 L-40 120 L0 50 L40 120 L100 -20" fill="none" stroke="#ffffff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Eco/Naturista Leaf Accent -->
    <path d="M0 -130 Q40 -170 60 -120 Q60 -70 0 -130 Z" fill="url(#leafGrad)" stroke="#ffffff" stroke-width="8" />
  </g>
</svg>
